name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  report:
    name: corpus report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pip install -e ".[dev]"
      - name: Install the JavaScript highlighters
        run: npm install --no-audit --no-fund
        working-directory: src/lexdrift/js
      - name: Run the corpus against every library
        run: |
          lexdrift libs
          lexdrift check --format markdown | tee report.md
      - uses: actions/upload-artifact@v4
        with:
          name: lexdrift-report
          path: report.md
